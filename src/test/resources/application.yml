spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/smartbadge}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

logging:
  level:
    com.smartbadge.adl: DEBUG

app:
  security:
    enabled: false
