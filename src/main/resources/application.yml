spring:
  application:
    name: smartbadge-adl-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/smartbadge}
      database: smartbadge
      auto-index-creation: true
  jackson:
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: SmartBadge ADL Service
    version: 1.0.0
    description: SmartBadge ADL HRMS - Spring Modulith + MongoDB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

app:
  openapi:
    dev-url: http://localhost:8080

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
  level:
    com.smartbadge.adl: INFO
    org.springframework.data.mongodb: WARN
