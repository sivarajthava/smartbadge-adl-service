version: '3.9'

services:

  mongodb:
    image: mongo:7.0
    container_name: hrms-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-hrmsadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-hrmspassword}
      MONGO_INITDB_DATABASE: hrms_db
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - hrms-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrms-staff-management
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://${MONGO_USERNAME:-hrmsadmin}:${MONGO_PASSWORD:-hrmspassword}@mongodb:27017/hrms_db?authSource=admin
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - hrms-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mongo_data:
    driver: local

networks:
  hrms-network:
    driver: bridge
